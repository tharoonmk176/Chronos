# UNVALIDATED — no Docker daemon available in the dev sandbox this was written in.
# Everything here was instead run as user-space processes and verified live: Postgres on
# 5544, Redis on 6399, a real Celery worker, a real uvicorn server. See TASKS.md for what
# was actually exercised vs. what's config-only.
version: '3.8'

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: fintech
      POSTGRES_PASSWORD: fintech_dev_pw
      POSTGRES_DB: fintech_db
    ports:
      - "5544:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6399:6379"

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://fintech:fintech_dev_pw@postgres:5432/fintech_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
    depends_on:
      - postgres
      - redis

  celery_worker:
    build: .
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://fintech:fintech_dev_pw@postgres:5432/fintech_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin

volumes:
  postgres_data:
